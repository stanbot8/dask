name: Tests

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:
  schedule:
    # Rerun CI in order to detect flaky tests. Note that all packages are pinned, so
    # these scheduled runs are unaffected by upstream releases.
    # The upstream.yml workflow will instead pick up upstream changes.
  - cron: 0 6,18 * * *

# When this workflow is queued, automatically cancel any previous running
# or pending jobs from the same branch
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && (true) }}

jobs:
  test:
    # Do not run the schedule job on forks
    if: ${{ (github.repository == 'dask/dask' || github.event_name != 
      'schedule') && needs.alpha_bridge_inputs.outputs.changed == 'true' }}

    # If you change the pattern of this name, please adjust
    # ../distributed/continuous_integration/scripts/test_report.py accordingly
    name: ${{ matrix.os }} ${{ matrix.environment }} ${{ matrix.task }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Note: after adding/removing builds here, update
        # codecov.yml to match.
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
        environment: [py310, py311, py312, py313, py314]
        task: [test-ci]
        include:
          # MacOS CI does not have many hosts available; run it on 3.14 only
        - os: macos-latest
          environment: py314
          task: test-ci
          # Minimum dependencies
        - os: ubuntu-latest
          environment: mindeps-array
          task: test-ci
        - os: ubuntu-latest
          environment: mindeps-dataframe
          task: test-ci
        - os: ubuntu-latest
          environment: mindeps-distributed
          task: test-ci
        - os: ubuntu-latest
          environment: mindeps-non-optional
          task: test-ci
        - os: ubuntu-latest
          environment: mindeps-optional
          task: test-ci
          # Experimental setups
        - os: ubuntu-latest
          environment: py314
          task: test-array-expr
        - os: ubuntu-latest
          environment: mindeps-array
          task: test-array-expr
        - os: ubuntu-latest
          environment: py314t
          task: test-ci
        - os: ubuntu-latest
          environment: spark
          task: test-spark

    steps:
    - name: Checkout source
      uses: actions/checkout@v7
      with:
        fetch-depth: 0    # Needed by codecov.io

    - name: Reconfigure pytest-timeout
        # No SIGALRM available on Windows
        # Note: all changes to the source code must happen before setup-pixi
        # or we'll build the package twice
      if: ${{ matrix.os != 'windows-latest' }}
      run: sed -i.bak 's/timeout_method = "thread"/timeout_method = "signal"/' 
        pyproject.toml

    - uses: prefix-dev/setup-pixi@v0.10.0
      with:
        pixi-version: v0.72.1
        environments: ${{ matrix.environment }}
        cache: true
        locked: true

    - name: Run tests
      id: run_tests
      run: pixi run -e ${{ matrix.environment }} ${{ matrix.task }}

    - name: Coverage
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Upload test results
        # ensure this runs even if pytest fails
      if: >
        always() &&
        (steps.run_tests.outcome == 'success' || steps.run_tests.outcome == 'failure')
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.os }}-${{ matrix.environment }}-${{ matrix.task }}
        path: pytest.xml

  # Publish an artifact for the event; used by publish-test-results.yaml
    needs:
    - alpha_bridge_inputs
  event_file:
    # Do not run the schedule job on forks
    if: ${{ (github.repository == 'dask/dask' || github.event_name != 
      'schedule') && needs.alpha_bridge_inputs.outputs.changed == 'true' }}
    name: Event File
    runs-on: ubuntu-latest
    steps:
    - name: Upload
      uses: actions/upload-artifact@v7
      with:
        name: Event File
        path: ${{ github.event_path }}
    needs:
    - alpha_bridge_inputs
  alpha_bridge_inputs:
    name: AlphaBridge input check
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    concurrency:
      group: alpha-bridge-inputs-${{ github.workflow }}-${{ github.sha }}-${{ 
        github.event.schedule || github.event_name }}
      cancel-in-progress: false
    outputs:
      changed: ${{ steps.identity.outputs.changed }}
    steps:
    - id: identity
      name: Check source, workflow, variables, and runner inputs
      env:
        GH_TOKEN: ${{ github.token }}
        AB_REPOSITORY: ${{ github.repository }}
        AB_RUN_ID: ${{ github.run_id }}
        AB_HEAD_SHA: 6ce3740fa79bfa051ecc74c3641f8c6a46dfdc30
        AB_WORKFLOW_DIGEST: 
          abef6ca09db052f7846d61e88534140d0244be7aef2facff6e4315d1da1c34ae
        AB_EVENT: ${{ github.event_name }}
        AB_SCHEDULE: ${{ github.event.schedule || '' }}
        AB_VARIABLES: ${{ toJSON(vars) }}
        AB_INPUTS: ${{ toJSON(inputs) }}
      shell: bash
      run: "python3 - <<'ALPHA_BRIDGE_CI_PY'\n\"\"\"Native scheduled-CI input check,
        embedded in the owned fork configuration.\"\"\"\n\nfrom __future__ import
        annotations\n\nimport hashlib\nimport json\nimport os\nimport urllib.parse\n\
        import urllib.request\n\n\ndef changed(get, *, repository, run_id, identity,
        job_name):\n    current = get(f\"/repos/{repository}/actions/runs/{run_id}\"\
        )\n    event = current[\"event\"]\n    query = urllib.parse.urlencode(\n \
        \       {\n            \"branch\": current[\"head_branch\"],\n           \
        \ \"event\": event,\n            \"per_page\": 100,\n        }\n    )\n  \
        \  runs = get(f\"/repos/{repository}/actions/workflows/{current['workflow_id']}/runs?{query}\"\
        )\n    for run in runs[\"workflow_runs\"]:\n        if run[\"id\"] == run_id:\n\
        \            continue\n        if run.get(\"head_branch\") != current[\"head_branch\"\
        ] or run.get(\"event\") != event:\n            raise ValueError(\"provider
        returned a different CI input identity\")\n        page = 1\n        while
        True:\n            jobs = get(\n                f\"/repos/{repository}/actions/runs/{run['id']}/jobs?per_page=100&page={page}\"\
        \n            )[\"jobs\"]\n            for job in jobs:\n                if
        (\n                    job[\"name\"] == job_name\n                    and
        job.get(\"status\") == \"completed\"\n                    and job.get(\"conclusion\"\
        ) == \"success\"\n                    and any(\n                        step[\"\
        name\"] == f\"AlphaBridge input identity {identity}\"\n                  \
        \      and step.get(\"conclusion\") == \"success\"\n                     \
        \   for step in job.get(\"steps\", [])\n                    )\n          \
        \      ):\n                    return False\n            if len(jobs) < 100:\n\
        \                break\n            page += 1\n    return True\n\n\ndef main():\n\
        \    inputs = {\n        \"source_commit\": os.environ[\"AB_HEAD_SHA\"],\n\
        \        \"workflow_definition\": os.environ[\"AB_WORKFLOW_DIGEST\"],\n  \
        \      \"event\": os.environ[\"AB_EVENT\"],\n        \"schedule\": os.environ[\"\
        AB_SCHEDULE\"],\n        \"variables\": json.loads(os.environ[\"AB_VARIABLES\"\
        ]),\n        \"inputs\": json.loads(os.environ[\"AB_INPUTS\"]),\n        \"\
        runner_image\": [os.environ.get(\"ImageOS\", \"\"), os.environ.get(\"ImageVersion\"\
        , \"\")],\n    }\n    identity = hashlib.sha256(json.dumps(inputs, sort_keys=True).encode()).hexdigest()\n\
        \n    def get(path):\n        request = urllib.request.Request(\n        \
        \    \"https://api.github.com\" + path,\n            headers={\n         \
        \       \"Authorization\": \"Bearer \" + os.environ[\"GH_TOKEN\"],\n     \
        \           \"Accept\": \"application/vnd.github+json\",\n               \
        \ \"X-GitHub-Api-Version\": \"2026-03-10\",\n            },\n        )\n \
        \       with urllib.request.urlopen(request, timeout=60) as response:\n  \
        \          return json.load(response)\n\n    should_run = inputs[\"event\"\
        ] != \"schedule\" or changed(\n        get,\n        repository=os.environ[\"\
        AB_REPOSITORY\"],\n        run_id=int(os.environ[\"AB_RUN_ID\"]),\n      \
        \  identity=identity,\n        job_name=\"AlphaBridge input check\",\n   \
        \ )\n    with open(os.environ[\"GITHUB_OUTPUT\"], \"a\", encoding=\"utf-8\"\
        ) as output:\n        output.write(f\"digest={identity}\\nchanged={str(should_run).lower()}\\\
        n\")\n    print(\"CI inputs changed\" if should_run else \"CI inputs unchanged;
        build and test jobs skipped\")\n\n\nif __name__ == \"__main__\":\n    main()\n\
        \nALPHA_BRIDGE_CI_PY\n"
    - name: AlphaBridge input identity ${{ steps.identity.outputs.digest }}
      run: echo 'Input identity recorded'
